name: Verify the Windows SDK documentation samples

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sdk-examples.yml'
      - 'assets/interception-device-inventory.c'
      - 'assets/vdevice-hid-test.cpp'
      - 'assets/interceptor-status.cpp'
      - 'assets/vdevice-status.cpp'
      - 'assets/audio-link-inventory.cpp'
      - 'assets/audio-link-pair-check.cpp'
      - 'assets/interception-slot-types.c'
      - 'sdk-checks.json'
      - 'starter-apps.json'
      - 'sdk-registry.json'
      - 'integration.schema.json'
      - 'scripts/registry.py'
      - 'scripts/go_samples.py'
      - 'assets/go-sdk-first-checks-*.json'
      - 'scripts/rust_samples.py'
      - 'assets/rust-sdk-*.json'
      - 'scripts/verify_registry.py'
      - 'scripts/verify_integration_schema.py'
      - 'assets/browser-sdk-first-run.py'
      - 'assets/browser-python-first-run-*.json'
      - 'assets/node-sdk-status.cjs'
      - 'assets/gallery-sdk-status.ps1'
      - 'assets/python-*.py'
      - 'assets/*-python-wheel-check-*.json'
      - 'assets/dotnet-interceptor-status.cs'
      - 'assets/sdk-registry-runtime-*.json'
      - 'scripts/test_first_sdk.py'
      - 'scripts/compile_documented_samples.py'
      - 'scripts/build.py'
      - 'scripts/integration.py'
      - 'releases.json'
      - 'scripts/verify_release_assets.py'
      - 'scripts/tests/test_*.py'
  pull_request:
    paths:
      - '.github/workflows/sdk-examples.yml'
      - 'assets/interception-device-inventory.c'
      - 'assets/vdevice-hid-test.cpp'
      - 'assets/interceptor-status.cpp'
      - 'assets/vdevice-status.cpp'
      - 'assets/audio-link-inventory.cpp'
      - 'assets/audio-link-pair-check.cpp'
      - 'assets/interception-slot-types.c'
      - 'sdk-checks.json'
      - 'starter-apps.json'
      - 'sdk-registry.json'
      - 'integration.schema.json'
      - 'scripts/registry.py'
      - 'scripts/go_samples.py'
      - 'assets/go-sdk-first-checks-*.json'
      - 'scripts/rust_samples.py'
      - 'assets/rust-sdk-*.json'
      - 'scripts/verify_registry.py'
      - 'scripts/verify_integration_schema.py'
      - 'assets/browser-sdk-first-run.py'
      - 'assets/browser-python-first-run-*.json'
      - 'assets/node-sdk-status.cjs'
      - 'assets/gallery-sdk-status.ps1'
      - 'assets/python-*.py'
      - 'assets/*-python-wheel-check-*.json'
      - 'assets/dotnet-interceptor-status.cs'
      - 'assets/sdk-registry-runtime-*.json'
      - 'scripts/test_first_sdk.py'
      - 'scripts/compile_documented_samples.py'
      - 'scripts/build.py'
      - 'scripts/integration.py'
      - 'releases.json'
      - 'scripts/verify_release_assets.py'
      - 'scripts/tests/test_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/build.py
      - run: python3 scripts/verify_release_assets.py
        env:
          TITANCSA_CATALOGUE_TOKEN: ${{ github.token }}
      - run: python3 scripts/verify_registry.py --documentation
      - run: python3 -m pip install jsonschema==4.26.0 rfc3986-validator==0.1.1
      - run: python3 scripts/verify_integration_schema.py
      - run: python3 -m unittest discover -s scripts/tests
  documented-examples:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build.py
      - run: python scripts/compile_documented_samples.py
  first-sdk-checks:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build.py
      - name: Extract the public starter ZIP and run every check
        shell: pwsh
        run: |
          $saved = Join-Path $env:RUNNER_TEMP 'First SDK Checks'
          Expand-Archive -LiteralPath dist/downloads/first-sdk-checks.zip -DestinationPath $saved
          Set-Location -LiteralPath $saved
          python scripts/test_first_sdk.py all --expect-clean
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check pinned PyPI and GitHub wheels on clean Windows
        run: python scripts/verify_registry.py --check-python-on-clean-windows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: 'x64'
          package-manager-cache: false
      - name: Run the documented npm status checks on clean Windows
        run: python scripts/verify_registry.py --check-node-on-clean-windows
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Run the published Go programs on clean Windows
        run: python scripts/verify_registry.py --check-go-on-clean-windows
      - name: Run the published Rust programs on clean Windows
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_registry.py --check-rust-on-clean-windows
