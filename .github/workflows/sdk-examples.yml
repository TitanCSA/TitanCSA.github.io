name: Verify the Windows SDK documentation samples

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sdk-examples.yml'
      - 'assets/interception-device-inventory.c'
      - 'assets/vdevice-hid-test.cpp'
      - 'assets/interceptor-status.cpp'
      - 'assets/vdevice-status.cpp'
      - 'assets/audio-link-inventory.cpp'
      - 'assets/interception-slot-types.c'
      - 'sdk-checks.json'
      - 'starter-apps.json'
      - 'assets/browser-sdk-first-run.py'
      - 'scripts/test_first_sdk.py'
      - 'scripts/integration.py'
      - 'releases.json'
      - 'scripts/verify_release_assets.py'
      - 'scripts/tests/test_release_assets.py'
  pull_request:
    paths:
      - '.github/workflows/sdk-examples.yml'
      - 'assets/interception-device-inventory.c'
      - 'assets/vdevice-hid-test.cpp'
      - 'assets/interceptor-status.cpp'
      - 'assets/vdevice-status.cpp'
      - 'assets/audio-link-inventory.cpp'
      - 'assets/interception-slot-types.c'
      - 'sdk-checks.json'
      - 'starter-apps.json'
      - 'assets/browser-sdk-first-run.py'
      - 'scripts/test_first_sdk.py'
      - 'scripts/integration.py'
      - 'releases.json'
      - 'scripts/verify_release_assets.py'
      - 'scripts/tests/test_release_assets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build.py
      - run: python3 scripts/verify_release_assets.py
        env:
          TITANCSA_CATALOGUE_TOKEN: ${{ github.token }}
      - run: python3 -m unittest discover -s scripts/tests
  inventory:
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: x86
            generator_platform: Win32
          - abi: x64
            generator_platform: x64
    env:
      V2_ABI: ${{ matrix.abi }}
      V2_GENERATOR_PLATFORM: ${{ matrix.generator_platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile against the published SDK ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'https://github.com/TitanCSA/Interception-V2/releases/download/v2.0.0'
          $work = Join-Path $env:RUNNER_TEMP 'interception-v2-sample'
          New-Item -ItemType Directory -Path $work | Out-Null
          $zip = Join-Path $work 'Interception-V2.zip'
          $sums = Join-Path $work 'SHA256SUMS.txt'
          Invoke-WebRequest "$release/Interception-V2.zip" -OutFile $zip
          Invoke-WebRequest "$release/SHA256SUMS.txt" -OutFile $sums
          $expected = (Get-Content $sums | Where-Object { $_ -match 'Interception-V2\.zip$' }) -split '\s+'
          if ($expected[0] -ne (Get-FileHash $zip).Hash) { throw 'Release ZIP checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $work
          Copy-Item -LiteralPath assets/interception-device-inventory.c -Destination $work
          @'
          cmake_minimum_required(VERSION 3.20)
          project(InterceptionInventory C)
          add_executable(inventory interception-device-inventory.c)
          set_property(TARGET inventory PROPERTY MSVC_RUNTIME_LIBRARY MultiThreaded)
          target_compile_options(inventory PRIVATE /W4 /WX)
          target_include_directories(inventory PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/Interception/library")
          target_link_libraries(inventory PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/Interception/library/${ABI}/interception.lib")
          '@ | Set-Content -LiteralPath (Join-Path $work 'CMakeLists.txt') -Encoding ascii
          $build = Join-Path $work 'build'
          cmake -S $work -B $build -G 'Visual Studio 17 2022' -A $env:V2_GENERATOR_PLATFORM "-DABI=$env:V2_ABI"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build $build --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  vdevice-hid:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile the HID fixture against the pinned Vdevice demo SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'vdevice-hid-sample'
          New-Item -ItemType Directory -Path $work | Out-Null
          $zip = Join-Path $work 'Vdevice-SDK-1.0.6.0.zip'
          $release = 'https://github.com/TitanCSA/Vdevice/releases/download/v1.0.6.0-demo'
          Invoke-WebRequest "$release/Vdevice-SDK-1.0.6.0.zip" -OutFile $zip
          $proof = Get-Content -LiteralPath assets/vdevice-hid-test-20261124.json -Raw | ConvertFrom-Json
          if ((Get-FileHash -LiteralPath $zip).Hash -ne $proof.sdk_zip_sha256) { throw 'Demo SDK checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $work
          Copy-Item -LiteralPath assets/vdevice-hid-test.cpp -Destination $work
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $studio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$studio) { throw 'Visual Studio C++ desktop tools are required' }
          & (Join-Path $studio 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Set-Location -LiteralPath $work
          cl /nologo /W4 /WX /MT /std:c++17 /EHsc /utf-8 /permissive- /DUNICODE /D_UNICODE /I Vdevice-SDK-1.0.6.0\Vdevice vdevice-hid-test.cpp Vdevice-SDK-1.0.6.0\Vdevice\Vdevice.cpp /Fe:vdevice-hid-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  first-sdk-checks:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build.py
      - name: Extract the public starter ZIP and run every check
        shell: pwsh
        run: |
          $saved = Join-Path $env:RUNNER_TEMP 'First SDK Checks'
          Expand-Archive -LiteralPath dist/downloads/first-sdk-checks.zip -DestinationPath $saved
          Set-Location -LiteralPath $saved
          python scripts/test_first_sdk.py all --expect-clean
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
